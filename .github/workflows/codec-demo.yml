name: CPU codec demo
on: [push, pull_request, workflow_dispatch]
jobs:
  demo:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: envs/requirements-demo.txt
      - run: python -m pip install -r envs/requirements-demo.txt
      - run: python scripts/core/run_codec_demo.py
      - run: diff -u examples/codec/expected_roundtrips.tsv results/demo/roundtrips.tsv
